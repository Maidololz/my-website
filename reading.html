<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading · Maido</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="apple-touch-icon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header></header>

  <main class="container">
    <section class="fade-in">
      <h2><span data-lang="zh">閱讀清單</span><span data-lang="en">Reading List</span></h2>
      <ul class="list">
        <li class="card">
          <div class="meta">📖 <span data-lang="zh">正在讀</span><span data-lang="en">Reading now</span></div>
          <h3>Book Title</h3>
          <p class="muted">Author</p>
        </li>
        <li class="card">
          <div class="meta">✅ <span data-lang="zh">讀完了</span><span data-lang="en">Finished</span> · 2026</div>
          <h3>Another Book</h3>
          <p class="muted">Author</p>
          <p data-lang="zh">一句話心得。</p>
          <p data-lang="en">A one-line takeaway.</p>
        </li>
      </ul>
    </section>
  </main>

  <footer></footer>
  <script src="script.js"></script>
</body>
</html>
