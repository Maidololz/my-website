<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Questions · Maido</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header></header>

  <main class="container">
    <section class="fade-in">
      <h2><span data-lang="zh">常被問的問題</span><span data-lang="en">Questions</span></h2>
      <div class="list">
        <details class="card">
          <summary>
            <span data-lang="zh">為什麼想做這個網站？</span>
            <span data-lang="en">Why did you make this website?</span>
          </summary>
          <p data-lang="zh">在這裡寫下你的回答。</p>
          <p data-lang="en">Write your answer here.</p>
        </details>
        <details class="card">
          <summary>
            <span data-lang="zh">你最喜歡的一本書是？</span>
            <span data-lang="en">What's your favorite book?</span>
          </summary>
          <p data-lang="zh">在這裡寫下你的回答。</p>
          <p data-lang="en">Write your answer here.</p>
        </details>
      </div>
    </section>
  </main>

  <footer></footer>
  <script src="script.js"></script>
</body>
</html>
